<!DOCTYPE html>
<html>
<head>
  <title>Mod Access Portal</title>
  <style>
    body { font-family: Arial; background: #f2f2f2; padding: 20px; }
    .box { background: #fff; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
    input, textarea, button { width: 100%; padding: 10px; margin-top: 10px; }
    #paymentOption, #modRequestBox, #adminLoginBox, #adminPanel { display: none; }
    pre { background: #eee; padding: 10px; white-space: pre-wrap; border-radius: 8px; max-height: 300px; overflow-y: scroll; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Mod Access Portal</h2>

    <!-- Admin Login -->
    <div id="adminLoginBox">
      <h3>Admin Login</h3>
      <input type="password" id="adminPassword" placeholder="Enter admin password">
      <button onclick="loginAsAdmin()">Login</button>
    </div>

    <!-- User Verification -->
    <form id="verifyForm">
      <label>Your YouTube Channel Name:</label>
      <input type="text" name="channelName" required>
      <button type="submit">Submit</button>
    </form>

    <!-- Payment Fallback -->
    <div id="paymentOption">
      <p>You are not verified. Please pay $2 to proceed.</p>
      <a href="https://buy.stripe.com/test_donation_link" target="_blank"><button>Pay $2</button></a>
      <button onclick="showModForm()">I Paid</button>
    </div>

    <!-- Mod Request -->
    <div id="modRequestBox">
      <h3>Request a Mod</h3>
      <form id="modForm">
        <textarea name="modRequest" placeholder="Describe the mod you want..." required></textarea>
        <button type="submit">Send Request</button>
      </form>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel">
      <h3>Admin Panel: Submissions</h3>
      <pre id="log">Loading...</pre>
    </div>

    <!-- Admin Access Toggle -->
    <hr>
    <p style="text-align: center;"><a href="#" onclick="toggleAdminLogin()">🔒 Admin?</a></p>
  </div>

  <script>
    const verifyForm = document.getElementById('verifyForm');
    const modForm = document.getElementById('modForm');

    verifyForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const channel = verifyForm.channelName.value.trim();
      if (!channel) return;

      let subs = JSON.parse(localStorage.getItem('submissions') || "[]");
      subs.push({ type: "Channel", value: channel, time: new Date().toLocaleString() });
      localStorage.setItem('submissions', JSON.stringify(subs));

      alert("Channel submitted. You'll be verified shortly.");
      document.getElementById('paymentOption').style.display = 'block';
      verifyForm.reset();
    });

    modForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const modText = modForm.modRequest.value.trim();
      if (!modText) return;

      let subs = JSON.parse(localStorage.getItem('submissions') || "[]");
      subs.push({ type: "Mod Request", value: modText, time: new Date().toLocaleString() });
      localStorage.setItem('submissions', JSON.stringify(subs));

      alert("Mod request sent!");
      modForm.reset();
    });

    function showModForm() {
      document.getElementById('modRequestBox').style.display = 'block';
    }

    function toggleAdminLogin() {
      const box = document.getElementById('adminLoginBox');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function loginAsAdmin() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === "enter") {
        document.getElementById('adminLoginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        displaySubmissions();
      } else {
        alert("Wrong password.");
      }
    }

    function displaySubmissions() {
      const log = document.getElementById('log');
      let subs = JSON.parse(localStorage.getItem('submissions') || "[]");
      if (subs.length === 0) {
        log.textContent = "No submissions yet.";
        return;
      }
      log.textContent = subs.map(s => `[${s.time}] ${s.type}: ${s.value}`).join("\n\n");
    }
  </script>
</body>
</html>
